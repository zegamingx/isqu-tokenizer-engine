name: Build and ecosystem compatibility

on:
  push:
    branches:
      - main
    paths-ignore:
      - "gradlew"
      - "gradlew.bat"
      - "gradle/wrapper/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isqu-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Build and consumer compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle 9.9.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.9.1"

      - name: Generate pinned Gradle Wrapper
        run: gradle wrapper

      - name: Validate Gradle Wrapper JAR
        uses: gradle/actions/wrapper-validation@v6

      - name: Record build environment
        run: |
          java -version
          gradle --version
          ./gradlew --version

      - name: Build, test, and publish to Maven Local
        run: ./gradlew --no-daemon --stacktrace clean build publishToMavenLocal

      - name: Verify Java 11 / Kotlin 2.4 consumer
        run: ./gradlew --no-daemon --stacktrace -p compatibility/consumer clean verifyPublishedArtifacts build

      - name: Upload generated Gradle Wrapper
        uses: actions/upload-artifact@v4
        with:
          name: verified-gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error
          retention-days: 1

  commit-wrapper:
    name: Commit verified Gradle Wrapper
    needs: validate
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure main has not advanced since validation
        shell: bash
        run: |
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::warning::main advanced after validation; wrapper commit skipped. Re-run the workflow on the latest main."
            exit 0
          fi

      - name: Download verified Gradle Wrapper
        uses: actions/download-artifact@v4
        with:
          name: verified-gradle-wrapper
          path: .

      - name: Commit wrapper files
        shell: bash
        run: |
          chmod +x gradlew
          git add -- gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "Gradle Wrapper files are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: add verified Gradle Wrapper [skip ci]"
          git push origin HEAD:main
